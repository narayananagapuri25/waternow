name: WaterNow CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      run_read_only_d1_diagnostic:
        description: "Run only the read-only production D1 migration-ledger query (never migrate or deploy)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: waternow-ci-${{ github.ref }}
  # Never cancel a production deployment midway through a D1 migration.
  cancel-in-progress: false

jobs:
  worker-tests:
    name: Worker and D1 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Audit local D1 schema
        working-directory: worker
        run: node ./scripts/audit-local-schema.mjs
      - name: Run Worker tests
        working-directory: worker
        run: npm test

  owner-ui-regression:
    name: Owner UI regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Owner navigation, orders and performance contracts
        run: node --test admin-navigation.test.js admin-orders.test.js admin-performance.test.js

  browser-tests:
    name: Customer browser and Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run customer service-worker regression tests
        run: node sw-notification-refresh.test.js
      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run customer browser journeys
        working-directory: e2e
        run: npx playwright test --config=playwright.config.js
      - name: Install Worker dependencies for isolated delivery server
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run isolated delivery and store fallback tests
        working-directory: e2e
        run: npx playwright test --config=playwright.store-fallback.config.js

  production-d1-readonly-diagnostic:
    name: Read-only production D1 migration ledger diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - worker-tests
      - owner-ui-regression
      - browser-tests
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 4 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/fix/d1-baseline-diagnostics-2026-11-09') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != 'refs/heads/main' &&
       inputs.run_read_only_d1_diagnostic == true)
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker and Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Validate read-only diagnostic credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."; exit 1; }
          test "${CLOUDFLARE_ACCOUNT_ID}" = "17f1561ed0052cf9d484cb4becbf8810" || { echo "::error::Cloudflare account ID does not match the pinned WaterNow production account."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing."; exit 1; }
      - name: Query production D1 migration ledger (read only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          echo "Running SELECT-only diagnostic against the configured WaterNow production D1 database."
          echo "No migrations, SQL writes, Worker deployments, or secret values will be output."
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name FROM d1_migrations ORDER BY name" --json
      - name: Inventory production D1 tables (read only, even if ledger check fails)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name" --json
      - name: Inspect WaterNow migration schema and seeded records (read only)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          echo "WaterNow 0051 table definitions and related production columns:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name, sql FROM sqlite_master WHERE type = 'table' AND name IN ('water_suppliers','water_supplier_service_areas','water_supplier_products','water_delivery_partners','water_delivery_partner_service_areas','water_order_fulfilments','delivery_stores','store_profile') ORDER BY name" --json
          echo "WaterNow 0051 indexes:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name, sql FROM sqlite_master WHERE type = 'index' AND name LIKE 'idx_water_%' ORDER BY name" --json
          echo "WaterNow catalogue and invoice seed state from 0051/0052:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,name,price,active,stock_managed,stock_quantity FROM products WHERE id IN ('water-20l','water-10l-pair') ORDER BY id" --json
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,name,slug,active FROM categories WHERE id IN ('water-20l','water-10l-pair') ORDER BY id" --json
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,series_prefix FROM invoice_settings WHERE id=1" --json

  production-deploy:
    name: Deploy production D1 and WaterNow API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - worker-tests
      - owner-ui-regression
      - browser-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare deployment credentials
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."; exit 1; }
          test "${CLOUDFLARE_ACCOUNT_ID}" = "17f1561ed0052cf9d484cb4becbf8810" || { echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the account pinned in the WaterNow production config."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Add the CLOUDFLARE_API_TOKEN GitHub Actions secret."; exit 1; }
      - name: Install Worker and Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production D1 migration baseline
        run: node ./scripts/require-production-d1-baseline.mjs
      - name: Apply pending production D1 migrations
        run: npx wrangler d1 migrations apply waternow-production --remote --config wrangler.production.jsonc
      - name: Deploy WaterNow API Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Verify Worker API and Pages service-binding proxy
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const workerBase = 'https://waternow-api.narayana-nagapuri25-17f.workers.dev';
          const pagesProducts = 'https://waternow.pages.dev/api/products';

          async function getJson(url) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const body = await response.json().catch(() => null);
            if (!response.ok) {
              throw new Error(url + ' returned HTTP ' + response.status + ': ' + JSON.stringify(body));
            }
            if (!body || typeof body !== 'object' || body.error) {
              throw new Error(url + ' returned an invalid API response: ' + JSON.stringify(body));
            }
            return body;
          }

          const status = await getJson(workerBase + '/api/admin/status');
          if (status.ok !== true) throw new Error('WaterNow Worker health endpoint did not report ok=true');

          let lastError;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const body = await getJson(pagesProducts);
              const ids = new Set((body.products || []).map(product => product.id));
              for (const id of ['water-20l', 'water-10l-pair']) {
                if (!ids.has(id)) throw new Error('Pages API response is missing product ' + id);
              }
              console.log('Production smoke test passed: Worker health is OK and Pages reaches the WaterNow API through its WATERNOW_API binding.');
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 24) await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          throw lastError || new Error('Pages API smoke test failed.');
          NODE
