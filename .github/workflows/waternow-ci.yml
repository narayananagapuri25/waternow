name: WaterNow CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      run_read_only_d1_diagnostic:
        description: "Run only the read-only production D1 migration-ledger query (never migrate or deploy)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: waternow-ci-${{ github.ref }}
  # Never cancel a production deployment midway through a D1 migration.
  cancel-in-progress: false

jobs:
  worker-tests:
    name: Worker and D1 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Audit local D1 schema
        working-directory: worker
        run: node ./scripts/audit-local-schema.mjs
      - name: Self-test production schema comparison
        working-directory: worker
        run: python3 ./scripts/compare-production-schema.py --expected ./schema.sql --actual ./schema.sql
      - name: Validate production baseline bootstrap script syntax
        working-directory: worker
        run: node --check ./scripts/bootstrap-production-d1-baseline.mjs
      - name: Verify production baseline migration inventory
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import { expectedBaseline } from './scripts/bootstrap-production-d1-baseline.mjs';
          const names = expectedBaseline();
          for (const required of ['0051_waternow_supplier_network.sql', '0052_waternow_catalogue_seed.sql']) {
            if (!names.includes(required)) throw new Error('Baseline is missing ' + required);
          }
          if (names.includes('0053_delivery_store_supplier_partner_guards.sql')) {
            throw new Error('Pending migration 0053 must not be marked as baseline-applied.');
          }
          if (names.length < 40) throw new Error('Unexpectedly small migration inventory: ' + names.length);
          console.log('Verified ' + names.length + ' historical migrations through 0052; 0053 remains pending.');
          NODE
      - name: Build production Worker bundle without deploying
        working-directory: worker
        run: npx wrangler deploy --dry-run --config wrangler.production.jsonc
      - name: Run Worker tests
        working-directory: worker
        run: npm test

  owner-ui-regression:
    name: Owner UI regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Owner navigation, orders and performance contracts
        run: node --test admin-navigation.test.js admin-orders.test.js admin-performance.test.js

  browser-tests:
    name: Customer browser and Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run customer service-worker regression tests
        run: node sw-notification-refresh.test.js
      - name: Run customer catalogue display regression tests
        run: node frontend/customer/catalogue.test.js
      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run customer browser journeys
        working-directory: e2e
        run: npx playwright test --config=playwright.config.js
      - name: Install Worker dependencies for isolated delivery server
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run isolated delivery and store fallback tests
        working-directory: e2e
        run: npx playwright test --config=playwright.store-fallback.config.js

  production-d1-readonly-diagnostic:
    name: Read-only production D1 migration ledger diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - worker-tests
      - owner-ui-regression
      - browser-tests
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.number == 11 &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/fix/d1-baseline-diagnostics-2026-11-09' ||
         github.ref == 'refs/heads/fix/customer-map-location-guidance')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref != 'refs/heads/main' &&
        inputs.run_read_only_d1_diagnostic == true))
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Worker and Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Validate read-only diagnostic credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."; exit 1; }
          test "${CLOUDFLARE_ACCOUNT_ID}" = "17f1561ed0052cf9d484cb4becbf8810" || { echo "::error::Cloudflare account ID does not match the pinned WaterNow production account."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing."; exit 1; }
      - name: Check production D1 migration ledger (read only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          echo "Checking whether WaterNow production has a Wrangler migration ledger."
          echo "This step is read-only. An absent ledger is reported as a warning, not treated as proof that migrations are safe to replay."
          ledger_state="$(npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT COUNT(*) AS ledger_present FROM sqlite_master WHERE type='table' AND name='d1_migrations'" --json)"
          echo "$ledger_state"
          if echo "$ledger_state" | grep -Eq '"ledger_present"[[:space:]]*:[[:space:]]*1'; then
            npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name FROM d1_migrations ORDER BY name" --json
          else
            echo "::warning::Production D1 has no d1_migrations table. The main-branch deploy workflow will run the guarded baseline bootstrap; it writes migration metadata only after schema, data, foreign-key, and recovery-point preflight all pass."
          fi
      - name: Compare production schema with canonical WaterNow snapshot (read only)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          npx wrangler d1 export waternow-production --remote --skip-confirmation --no-data --output=/tmp/waternow-production-schema.sql
          python3 ./scripts/compare-production-schema.py --expected ./schema.sql --actual /tmp/waternow-production-schema.sql --allow-pending-0053 --allow-legacy-waternow-share-description-default
      - name: Audit legacy migration data fingerprints and foreign keys (read only)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          audit_sql="$(cat <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM products WHERE lower(trim(name)) IN ('apple','banana','grapes','guava','mango','orange','papaya','pineapple','pomegranate','watermelon')) AS retired_catalogue_products,
            (SELECT COUNT(*) FROM orders WHERE id IN ('FW-12031400-6NE','FW-53962202-NM5','FW-53402034-XBH','FW-31938520-0L7','FW-87828109-18W','FW-67922479-XYN','FW-08623690-412','FW-57069654-MR4','FW-35019352-MJ4','FW-78689788-FCD','FW-77588644-BHS','FW-70361915-UDE')) AS legacy_0050_test_orders,
            (SELECT COUNT(*) FROM addresses WHERE is_saved_address=1 AND (recipient_name IS NULL OR trim(recipient_name)='' OR delivery_phone IS NULL OR trim(delivery_phone)='')) AS incomplete_addresses_still_saved,
            (SELECT COUNT(*) FROM account_deletion_requests WHERE status='completed') AS completed_deletion_requests_not_anonymized,
            (SELECT COUNT(*) FROM delivery_stores s WHERE s.supplier_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM water_suppliers w WHERE w.id=s.supplier_id)) AS supplier_refs_without_supplier,
            (SELECT COUNT(*) FROM delivery_stores s WHERE s.delivery_partner_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM water_delivery_partners p WHERE p.id=s.delivery_partner_id)) AS partner_refs_without_partner,
            (SELECT COUNT(*) FROM orders o JOIN customers c ON c.id=o.customer_id WHERE c.phone IS NOT NULL AND trim(c.phone)<>'' AND o.customer_phone<>c.phone) AS orders_with_registered_phone_mismatch,
            (SELECT COUNT(*) FROM products WHERE active=1 AND id NOT IN ('water-20l','water-10l-pair')) AS non_water_active_products,
            (SELECT COUNT(*) FROM categories WHERE active=1 AND id NOT IN ('water-20l','water-10l-pair')) AS non_water_active_categories,
            (SELECT COUNT(*) FROM delivery_scheduling_settings WHERE id=1) AS delivery_scheduling_settings_count,
            (SELECT COUNT(*) FROM delivery_offer_settings WHERE id=1) AS delivery_offer_settings_count,
            (SELECT COUNT(*) FROM delivery_stores s CROSS JOIN products p WHERE NOT EXISTS (SELECT 1 FROM delivery_store_catalogue c WHERE c.store_id=s.id AND c.product_id=p.id)) AS missing_store_catalogue_rows,
            (SELECT COUNT(*) FROM invoice_settings i JOIN store_profile s ON s.id=1 WHERE i.id=1 AND i.enabled=0 AND length(trim(COALESCE(i.gstin,'')))=0 AND length(trim(COALESCE(s.store_name,'')))>0 AND length(trim(COALESCE(s.address,'')))>0) AS invoice_0028_still_eligible,
            (SELECT COUNT(*) FROM invoice_settings WHERE id=1 AND (length(trim(COALESCE(legal_name,'')))=0 OR length(trim(COALESCE(business_address,'')))=0 OR length(trim(COALESCE(state_name,'')))=0 OR length(trim(COALESCE(state_code,'')))=0 OR length(trim(COALESCE(gstin,'')))=0 OR length(trim(COALESCE(footer,'')))=0)) AS invoice_seller_defaults_still_blank,
            (SELECT COUNT(*) FROM invoice_settings WHERE id=1 AND (lower(trim(COALESCE(legal_name,'')))='freshway' OR lower(trim(COALESCE(business_address,''))) IN ('mancherial','mancherial telangana'))) AS legacy_invoice_placeholders,
            (SELECT COUNT(*) FROM store_profile WHERE id=1 AND lower(trim(COALESCE(address,''))) IN ('mancherial','mancherial telangana')) AS legacy_store_address_placeholder,
            (SELECT COUNT(*) FROM home_promotions WHERE active=1 AND ((id='promo-muzofq0q-rx6ie' AND alt_text='Buy 5ltr get ₹150 off') OR (id='promo-muzofqx8-0774i' AND alt_text='Buy 5ltr get ₹150 off') OR (id='promo-mvg9mrtf-5p0ae' AND COALESCE(TRIM(alt_text),'')=''))) AS legacy_promotion_alt_texts_remaining,
            (SELECT COUNT(*) FROM delivery_stores) AS delivery_stores_rows,
            (SELECT COUNT(*) FROM delivery_store_inventory) AS delivery_store_inventory_rows,
            (SELECT COUNT(*) FROM delivery_store_catalogue) AS delivery_store_catalogue_rows,
            (SELECT COUNT(*) FROM delivery_slots) AS delivery_slots_rows,
            (SELECT COUNT(*) FROM delivery_slot_reservations) AS delivery_slot_reservations_rows,
            (SELECT COUNT(*) FROM delivery_store_inventory_reservations) AS delivery_store_inventory_reservations_rows
          SQL
          )"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "$audit_sql" --json
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "PRAGMA foreign_key_check" --json
          echo "Invoice seller-field completeness (boolean flags only; no private seller values):"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT enabled AS invoice_enabled, document_type AS invoice_document_type, CASE WHEN legal_name IS NULL OR trim(legal_name)='' THEN 1 ELSE 0 END AS legal_name_blank, CASE WHEN business_address IS NULL OR trim(business_address)='' THEN 1 ELSE 0 END AS business_address_blank, CASE WHEN state_name IS NULL OR trim(state_name)='' THEN 1 ELSE 0 END AS state_name_blank, CASE WHEN state_code IS NULL OR trim(state_code)='' THEN 1 ELSE 0 END AS state_code_blank, CASE WHEN gstin IS NULL OR trim(gstin)='' THEN 1 ELSE 0 END AS gstin_blank, CASE WHEN footer IS NULL OR trim(footer)='' THEN 1 ELSE 0 END AS footer_blank, (SELECT CASE WHEN length(trim(COALESCE(store_name,'')))>0 THEN 1 ELSE 0 END FROM store_profile WHERE id=1) AS store_name_present, (SELECT CASE WHEN length(trim(COALESCE(address,'')))>0 THEN 1 ELSE 0 END FROM store_profile WHERE id=1) AS store_address_present FROM invoice_settings WHERE id=1" --json
      - name: Inventory production D1 tables (read only, even if ledger check fails)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name" --json
      - name: Inspect WaterNow migration schema and seeded records (read only)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          echo "WaterNow 0051 table definitions and related production columns:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name, sql FROM sqlite_master WHERE type = 'table' AND name IN ('water_suppliers','water_supplier_service_areas','water_supplier_products','water_delivery_partners','water_delivery_partner_service_areas','water_order_fulfilments','delivery_stores','store_profile') ORDER BY name" --json
          echo "WaterNow 0051 indexes:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT name, sql FROM sqlite_master WHERE type = 'index' AND name LIKE 'idx_water_%' ORDER BY name" --json
          echo "WaterNow catalogue and invoice seed state from 0051/0052:"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,name,price,active,stock_managed,stock_quantity FROM products WHERE id IN ('water-20l','water-10l-pair') ORDER BY id" --json
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,name,slug,active FROM categories WHERE id IN ('water-20l','water-10l-pair') ORDER BY id" --json
          echo "Active WaterNow products with category mapping (read only):"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT p.id,p.name,p.unit,p.price,p.active,p.category_id,c.name category_name,c.active category_active,p.stock_managed,p.stock_quantity FROM products p LEFT JOIN categories c ON c.id=p.category_id WHERE p.active=1 ORDER BY p.display_order,p.name" --json
          echo "WaterNow delivery stores and map-pin/radius configuration (read only):"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,name,address,latitude,longitude,service_radius_km,is_active,delivery_model FROM delivery_stores ORDER BY created_at,id" --json
          echo "Store catalogue visibility and inventory for active products (read only):"
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT s.id store_id,s.name store_name,sc.product_id,p.name product_name,sc.is_available,sc.price_override,COALESCE(i.stock_quantity,0) store_stock,p.stock_managed FROM delivery_stores s LEFT JOIN delivery_store_catalogue sc ON sc.store_id=s.id LEFT JOIN products p ON p.id=sc.product_id LEFT JOIN delivery_store_inventory i ON i.store_id=s.id AND i.product_id=p.id WHERE p.active=1 OR p.id IS NULL ORDER BY s.name,p.display_order,p.name" --json
          npx wrangler d1 execute waternow-production --remote --config wrangler.production.jsonc --command "SELECT id,series_prefix FROM invoice_settings WHERE id=1" --json
      - name: Read Cloudflare Workers build failure details (read only, best effort)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          // This diagnostic must never fail the release gate: unavailable log
          // permissions or an expired build record are reported, not thrown.
          try {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID || '17f1561ed0052cf9d484cb4becbf8810';
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!token) {
              console.log('Cloudflare API token unavailable; build log lookup skipped.');
            } else {
              const repository = process.env.GITHUB_REPOSITORY;
              const sha = process.env.GITHUB_SHA;
              const checksResponse = await fetch(
                'https://api.github.com/repos/' + repository + '/commits/' + sha + '/check-runs?per_page=100',
                { headers: { Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(12000) }
              );
              if (!checksResponse.ok) {
                console.log('GitHub check-run lookup unavailable: HTTP ' + checksResponse.status);
              } else {
                const checksBody = await checksResponse.json().catch(() => ({}));
                const workerBuildCheck = (checksBody.check_runs || []).find(item =>
                  String(item.name || '').startsWith('Workers Builds: waternow-api')
                );
                const detailsUrl = String(workerBuildCheck?.details_url || '');
                // URL pathname parsing avoids fragile slash-escaped regex literals.
                let build = '';
                try {
                  const segments = new URL(detailsUrl).pathname.split('/').filter(Boolean);
                  const candidate = segments[segments.length - 1] || '';
                  if (candidate.length === 36 && candidate.split('-').length === 5) build = candidate;
                } catch {
                  // Missing or malformed external check URL: keep the diagnostic best-effort.
                }
                if (!build) {
                  console.log('No Cloudflare Workers Builds UUID found on this commit.');
                } else {
                  const base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/builds/builds/' + build;
                  for (const suffix of ['', '/logs']) {
                    try {
                      const response = await fetch(base + suffix, {
                        headers: { Authorization: 'Bearer ' + token },
                        signal: AbortSignal.timeout(12000)
                      });
                      const body = await response.json().catch(() => ({}));
                      if (!response.ok || body.success === false) {
                        console.log(JSON.stringify({
                          endpoint: suffix || '/build',
                          httpStatus: response.status,
                          errors: (body.errors || []).map(item => item.message)
                        }));
                        continue;
                      }
                      if (suffix === '/logs') {
                        const lines = (body.result?.lines || []).map(row =>
                          Array.isArray(row) ? row.map(String).join(' ') : String(row)
                        );
                        const relevant = lines.filter(line =>
                          line.toLowerCase().includes('error') ||
                          line.toLowerCase().includes('failed') ||
                          line.toLowerCase().includes('fatal') ||
                          line.toLowerCase().includes('exit code') ||
                          line.toLowerCase().includes('not found') ||
                          line.toLowerCase().includes('permission')
                        );
                        console.log('Cloudflare Worker build log diagnostics for ' + build + ':');
                        for (const line of relevant.slice(-100)) console.log(line.slice(0, 1200));
                        if (!relevant.length) console.log('No error/failure lines were returned in the retained build log page.');
                      } else {
                        const result = body.result || {};
                        console.log(JSON.stringify({
                          build_uuid: result.build_uuid,
                          build_outcome: result.build_outcome,
                          created_on: result.created_on,
                          modified_on: result.modified_on
                        }));
                      }
                    } catch (error) {
                      console.log(JSON.stringify({ endpoint: suffix || '/build', error: error.message }));
                    }
                  }
                }
              }
            }
          } catch (error) {
            console.log('Best-effort Cloudflare build log lookup skipped: ' + String(error?.message || error));
          }
          NODE
      - name: Dry-run production D1 baseline bootstrap (read only)
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ./scripts/bootstrap-production-d1-baseline.mjs --dry-run

  production-deploy:
    name: Deploy production D1 and WaterNow API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - worker-tests
      - owner-ui-regression
      - browser-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Cloudflare deployment credentials
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."; exit 1; }
          test "${CLOUDFLARE_ACCOUNT_ID}" = "17f1561ed0052cf9d484cb4becbf8810" || { echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the account pinned in the WaterNow production config."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Add the CLOUDFLARE_API_TOKEN GitHub Actions secret."; exit 1; }
      - name: Install Worker and Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Bootstrap existing production D1 baseline when ledger is absent (preflight-gated)
        run: node ./scripts/bootstrap-production-d1-baseline.mjs
      - name: Verify production D1 migration baseline
        run: node ./scripts/require-production-d1-baseline.mjs
      - name: Apply pending production D1 migrations
        run: npx wrangler d1 migrations apply waternow-production --remote --config wrangler.production.jsonc
      - name: Deploy WaterNow API Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Verify Worker API, Boduppal delivery store and Pages catalogue
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const workerBase = 'https://waternow-api.narayana-nagapuri25-17f.workers.dev';
          const pagesBase = 'https://waternow.pages.dev';
          const storeId = 'waternow-boduppal';

          async function requestJson(url, options = {}) {
            const response = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body || typeof body !== 'object' || body.error) {
              throw new Error(url + ' returned HTTP ' + response.status + ': ' + JSON.stringify(body));
            }
            return body;
          }

          function verifyProducts(body, label) {
            const products = Array.isArray(body.products) ? body.products : [];
            if (products.length !== 2) throw new Error(label + ' should return exactly two active WaterNow products; got ' + products.length);
            const twenty = products.find(p => p.id === 'water-20l' && /20L/i.test(p.name) && Number(p.price) === 30);
            const tenPair = products.find(p => /10L/i.test(p.name) && /(two|2\s*[x×]|pack)/i.test(p.name + ' ' + p.unit) && p.unit === 'pack' && Number(p.price) === 20);
            if (!twenty) throw new Error(label + ' is missing the 20L can at ₹30.');
            if (!tenPair) throw new Error(label + ' is missing the pack of two 10L cans at ₹20.');
          }

          const status = await requestJson(workerBase + '/api/admin/status');
          if (status.ok !== true) throw new Error('WaterNow Worker health endpoint did not report ok=true');

          let lastError;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const [workerProducts, pagesProducts, workerStoreProducts, pagesStoreProducts] = await Promise.all([
                requestJson(workerBase + '/api/products'),
                requestJson(pagesBase + '/api/products'),
                requestJson(workerBase + '/api/products?storeId=' + encodeURIComponent(storeId)),
                requestJson(pagesBase + '/api/products?storeId=' + encodeURIComponent(storeId))
              ]);
              verifyProducts(workerProducts, 'Worker catalogue');
              verifyProducts(pagesProducts, 'Pages catalogue');
              verifyProducts(workerStoreProducts, 'Worker Boduppal store catalogue');
              verifyProducts(pagesStoreProducts, 'Pages Boduppal store catalogue');

              const address = { address: { latitude: 17.415, longitude: 78.585 } };
              const [workerDelivery, pagesDelivery] = await Promise.all([
                requestJson(workerBase + '/api/delivery/store', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(address) }),
                requestJson(pagesBase + '/api/delivery/store', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(address) })
              ]);
              for (const [label, result] of [['Worker', workerDelivery], ['Pages', pagesDelivery]]) {
