name: WaterNow Production Lifecycle Acceptance

on:
  push:
    branches:
      - qa/production-lifecycle-20261110
    paths:
      - e2e/scripts/production-lifecycle.mjs
      - e2e/scripts/production-public-smoke.mjs
      - e2e/scripts/ensure-production-coupon.mjs
      - .github/workflows/production-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waternow-production-lifecycle
  cancel-in-progress: false

jobs:
  prepare-production-coupon:
    name: Provision and verify fixed ₹30 QA coupon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate pinned WaterNow production D1 credentials
        shell: bash
        run: |
          set +x
          test "${CLOUDFLARE_ACCOUNT_ID}" = "17f1561ed0052cf9d484cb4becbf8810" || {
            echo "::error::Cloudflare account secret is missing or does not match WaterNow production."
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "::error::CLOUDFLARE_API_TOKEN Actions secret is missing."
            exit 1
          }

      - name: Syntax-check production QA runners
        run: |
          node --check e2e/scripts/ensure-production-coupon.mjs
          node --check e2e/scripts/production-lifecycle.mjs

      - name: Install Wrangler dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Create or verify production fixed ₹30 coupon
        run: node e2e/scripts/ensure-production-coupon.mjs

  public-production-smoke:
    name: Public production smoke tests (no orders)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-production-coupon
    env:
      WATERNOW_APP_ORIGIN: https://waternow.pages.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium for live browser UI checks
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Syntax-check public production smoke runners
        run: |
          node --check e2e/scripts/production-public-smoke.mjs
          node --check e2e/scripts/production-browser-smoke.mjs

      - name: Verify live customer, catalogue, delivery, pricing and protected Owner APIs
        run: node e2e/scripts/production-public-smoke.mjs

      - name: Verify live customer and Owner browser UI on mobile and desktop
        working-directory: e2e
        run: node ./scripts/production-browser-smoke.mjs

  production-lifecycle:
    name: Real production customer and Owner lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare-production-coupon
    env:
      WATERNOW_APP_ORIGIN: https://waternow.pages.dev
      WATERNOW_ADMIN_TOKEN: ${{ secrets.WATERNOW_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Check whether secure Owner credential is configured
        id: owner-credential
        shell: bash
        run: |
          set +x
          if test -n "${WATERNOW_ADMIN_TOKEN}"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Owner lifecycle credential is available through Actions secrets."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Owner lifecycle tests are safely skipped. Configure WATERNOW_ADMIN_TOKEN as a repository Actions secret to enable authenticated production testing."
            {
              echo "### Owner lifecycle tests skipped"
              echo "No production orders were created. Configure the Owner test credential as the private repository secret WATERNOW_ADMIN_TOKEN to enable authenticated lifecycle tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Playwright test dependencies
        if: steps.owner-credential.outputs.ready == 'true'
        working-directory: e2e
        run: npm ci

      - name: Install Chromium for real browser push subscriptions
        if: steps.owner-credential.outputs.ready == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run production checkout, lifecycle, reporting, support and push acceptance
        if: steps.owner-credential.outputs.ready == 'true'
        working-directory: e2e
        env:
          CI: "true"
        run: node ./scripts/production-lifecycle.mjs
