name: Import sanitized FreshWay source snapshot

on:
  push:
    branches: [main]
    paths: [.import-source-snapshot]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: freshway-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: destination
      - name: Check out FreshWay source snapshot
        uses: actions/checkout@v4
        with:
          repository: nagapurinarayana-ship-it/freshway
          ref: main
          path: source
          # Source repository is public; no source write access is requested.
      - name: Prepare sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          cd destination
          BRANCH="import/freshway-full-codebase-2026-11-07"
          git checkout -b "$BRANCH"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' ../source/ ./
          # Never import local secrets, runtime state, generated dependencies, or live test suites.
          find . -type f \( -name '.dev.vars' -o -name '.env' -o -name '.env.*' \) -delete
          rm -rf node_modules worker/node_modules .wrangler worker/.wrangler
          rm -rf e2e/production e2e/real-d1
          rm -f e2e/playwright.production.config.js e2e/playwright.real-d1.config.js
          rm -f pwa-live-smoke.mjs pwa-owner-live-smoke.mjs
          rm -f worker/scripts/audit-production-schema.mjs worker/scripts/store-operational-audit.mjs
          rm -f worker/scripts/store-operational-history.sql worker/scripts/store-operational-matrix.sql
          rm -f worker/scripts/store-operational-orders.sql worker/scripts/store-operational-reservations.sql
          rm -f DEPLOY_TRIGGER_*
          cat > README.md <<'EOF'
          # Configurable commerce PWA starter

          This private repository contains a full application source snapshot imported from FreshWay: customer PWA, owner/admin interface, Cloudflare Pages Functions and Worker API, D1 schema and migrations, assets, and automated tests.

          ## Safety and reuse
          - This is a development/template copy, not a live FreshWay deployment.
          - Production deployment workflows and production/live-data audit suites were intentionally omitted.
          - No production credentials or production D1 database identifier are included.
          - Configure your own Cloudflare account, D1 database, domain, secrets, and notification providers before deployment.
          - Never point local, preview, or test environments at a production database.

          ## Quick start
          1. Use a supported Node.js LTS release.
          2. Review ARCHITECTURE.md, CONTRIBUTING.md, SECURITY.md, and worker/README.md.
          3. Create an isolated local/preview D1 database.
          4. Create local-only secrets in worker/.dev.vars (ignored by Git; never commit it).
          5. Install Worker dependencies: cd worker && npm install.
          6. Initialize local D1 from worker/schema.sql and run the Worker locally.
          7. Run unit and isolated Playwright tests before configuring deployment.

          ## Source snapshot
          Imported from nagapurinarayana-ship-it/freshway, branch main, during 2026-11-07. This is a snapshot, not a fork; future changes do not synchronize automatically.
          EOF
          cat > worker/wrangler.jsonc <<'EOF'
          {
            "name": "commerce-api-local-template",
            "main": "src/admin-auth.js",
            "compatibility_date": "2026-09-06",
            "compatibility_flags": ["nodejs_compat"],
            "d1_databases": [{
              "binding": "DB",
              "database_name": "commerce-development",
              "database_id": "00000000-0000-4000-8000-000000000001"
            }],
            "vars": {
              "FRESHWAY_ENVIRONMENT": "development",
              "APP_ORIGIN": "http://localhost:8788",
              "APP_ORIGINS": "http://localhost:8788,http://127.0.0.1:8788,http://localhost:8787,http://127.0.0.1:8787"
            }
          }
          EOF
          cat > worker/README.md <<'EOF'
          # Cloudflare Worker and D1 setup

          This directory contains the API Worker, D1 schema, migrations, and tests. wrangler.jsonc is a local-development template with a placeholder database ID and localhost origins; do not deploy it as-is.

          ## Local setup
          1. Create worker/.dev.vars (ignored by Git) with local-only dummy values:
             ADMIN_TOKEN, CUSTOMER_SESSION_SECRET, ADMIN_SESSION_SECRET.
          2. Install dependencies: npm install.
          3. Initialize local D1 from schema.sql:
             npx wrangler d1 execute commerce-development --local --file=./schema.sql --config=./wrangler.jsonc
          4. Start locally: npx wrangler dev --local --config=./wrangler.jsonc --port 8787.

          Use isolated local/preview databases for all tests. Never use production credentials or production customer/order data. For a real deployment, create your own Cloudflare resources, configure secrets in the provider secret manager, replace the placeholder D1 ID, review CORS/origin settings, and add a separately reviewed deployment workflow.

          Never commit ADMIN_TOKEN, session secrets, VAPID private keys, Twilio credentials, WhatsApp credentials, or any other secret. For a new local database bootstrap from schema.sql. For an existing development database apply only migrations not already applied.
          EOF
          # Defensive checks for accidental environment files and the known production D1 UUID.
          test -z "$(find . -type f \( -name '.dev.vars' -o -name '.env' -o -name '.env.*' \) -print -quit)"
          ! grep -RIl --exclude-dir=.git --exclude='*.md' '4b645f26-12ad-4805-bf22-12186122ad3a' .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: import sanitized FreshWay source snapshot"
          git push origin "$BRANCH"
          echo "IMPORT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --repo "${{ github.repository }}" --base main --head "import/freshway-full-codebase-2026-11-07" --draft --title "Import sanitized FreshWay codebase snapshot" --body "Imports the full application source snapshot from nagapurinarayana-ship-it/freshway. Includes customer and owner apps, Worker API, D1 schema/migrations, assets and isolated tests. Omits production deployment workflows and live-data suites; replaces production D1 binding with a local placeholder. No production secrets or live database IDs are copied. Source repository is unchanged. Please review before merge."
